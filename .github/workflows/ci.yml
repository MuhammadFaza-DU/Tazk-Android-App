name: CI

# T0 CI gate — the same checks the project treats as "definition of done":
#   dart analyze -> 0 issues, flutter test -> green.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (must be 0 issues)
        run: dart analyze

      - name: Test (must be green)
        run: flutter test